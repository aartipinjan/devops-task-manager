services:
  # ========== POSTGRESQL DATABASE ==========
  db:
    image: postgres:15-alpine
    container_name: task-manager-db
    
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskdb
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    
    expose:
      - "5432"
    
    volumes:
      - db_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    restart: unless-stopped
    
    networks:
      - app-network

  # ========== NODE.JS BACKEND API ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task-manager-backend
    
    environment:
      NODE_ENV: production
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: taskdb
      PORT: 5000
    
    ports:
      - "5000:5000"
    
    volumes:
      - ./backend:/app
      - /app/node_modules
    
    depends_on:
      db:
        condition: service_healthy
    
    restart: unless-stopped
    
    networks:
      - app-network

  # ========== REACT FRONTEND ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    
    environment:
      - REACT_APP_API_URL=http://backend:5000
      - CHOKIDAR_USEPOLLING=true
    
    ports:
      - "3000:80"
    
    volumes:
      - ./frontend:/app
      - /app/node_modules
    
    depends_on:
      - backend
    
    restart: unless-stopped
    
    networks:
      - app-network

volumes:
  db_data:
    driver: local

networks:
  app-network:
    driver: bridge
