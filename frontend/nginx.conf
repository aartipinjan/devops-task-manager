# Nginx configuration for React SPA (Single Page Application)
# This configuration handles:
# 1. Serving static files from /usr/share/nginx/html
# 2. Routing all non-file requests to index.html (React Router support)
# 3. Proper cache headers for performance
# 4. Gzip compression for faster delivery

server {
    listen 80;
    server_name _;

    # Enable Gzip compression for smaller file sizes
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # Root directory containing React build files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve static files (JS, CSS, images, etc.)
    # Cache static assets for 1 year (they have content hashes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Serve index.html for all other routes (React Router support)
    # This allows React Router to handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # Health check endpoint for Docker/Kubernetes
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}